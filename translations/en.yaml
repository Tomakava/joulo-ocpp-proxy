configuration:
  primary_csms_url:
    name: Primary CSMS URL
    description: >-
      Backend your chargers normally connect to, e.g.
      wss://your-csms.example.com/ocpp. The charger ID is appended
      automatically unless disabled below. Its replies are the only ones sent
      back to the charger. Can be left empty when every charger connects
      through a primary route.
  primary_csms_append_charge_point_id:
    name: Add charger ID to primary URL
    description: >-
      Adds /<charger ID> to the primary CSMS URL. Turn off if the backend gave
      you a complete URL that already identifies the charger.
  primary_csms_routes:
    name: Primary routes
    description: >-
      Send chargers to a different primary depending on the path in their URL.
      A charger at ws://proxy-host:9000/site-a/CHARGER-001 uses the route with
      path site-a. Chargers on any other path use the Primary CSMS URL.
    fields:
      path:
        name: Path
        description: >-
          Part of the charger URL between the port and the charger ID, e.g.
          site-a or ocpp/site-a.
      url:
        name: Primary CSMS URL
        description: >-
          Backend chargers on this path connect to, e.g.
          wss://site-a-csms.example.com/ocpp.
      append_charge_point_id:
        name: Add charger ID to this URL
        description: >-
          Adds /<charger ID> to this route's URL. Leave empty to follow
          "Add charger ID to primary URL".
  secondary_csms:
    name: Mirror to backends (all chargers)
    description: >-
      Extra backends that receive a copy of the traffic from every charger,
      under the charger's own ID. Their replies are never sent to the charger.
    fields:
      url:
        name: Backend URL
        description: >-
          WebSocket URL of the backend, e.g. wss://analytics.example.com/ocpp.
          The charger ID is appended automatically unless disabled below.
  secondary_csms_append_charge_point_id:
    name: Add charger ID to mirror URLs
    description: >-
      Adds /<charger ID> to every mirror backend URL (for per-charger mirrors,
      the charger ID on that backend). Turn off if your mirror URLs already
      identify the charger.
  charger_mappings:
    name: Mirror to backends (per charger)
    description: >-
      Mirror one specific charger to a backend, optionally under a different
      identity. Add one entry per charger and backend pair.
    fields:
      charger_id:
        name: Charger ID
        description: >-
          ID the charger connects to this proxy with, i.e. the last part of
          its OCPP URL (ws://proxy-host:9000/CHARGER-001 → CHARGER-001).
      secondary_url:
        name: Backend URL
        description: >-
          WebSocket URL of the backend this charger is mirrored to, e.g.
          wss://analytics.example.com/ocpp.
      mapped_charger_id:
        name: Charger ID on this backend
        description: >-
          Use when the backend knows this charger under a different ID. Leave
          empty to use the charger's own ID.
      password:
        name: Backend password
        description: >-
          Password for HTTP Basic auth on this backend. The username is the
          charger ID on this backend. Leave empty to reuse the charger's own
          credentials.
      id_tag:
        name: RFID tag (idTag) on this backend
        description: >-
          Replaces the idTag in StartTransaction sent to this backend, for
          backends that only accept their own tags. OCPP 1.6 only.
  log_level:
    name: Log level
    description: >-
      How much the proxy logs. Use debug to see OCPP message contents when
      troubleshooting.
  log_debug_message_max_length:
    name: Debug message length limit
    description: >-
      Maximum number of characters of each OCPP message shown in debug logs.
      0 shows complete messages.
  log_max_message_length:
    name: Debug message length limit (deprecated)
    description: >-
      Old name of "Debug message length limit". Leave empty and use that
      option instead.
network:
  9000/tcp: Port your chargers connect to (ws://<home-assistant-ip>:9000/<charger-id>)

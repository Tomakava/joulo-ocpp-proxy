services:
  ocpp-proxy:
    build: .
    user: node
    ports:
      - "9000:9000"
    volumes:
      # Persistent data directory. Holds:
      #   - config.json (place yours at ./data/config.json — see config.example.json)
      #   - state.json  (written by the proxy; preserves txIdMap across restarts
      #                  so MeterValues / StopTransaction continue to map correctly
      #                  after a restart mid-transaction)
      - ./data:/data
    environment:
      - PORT=9000
      - CONFIG_FILE=/data/config.json
      # Individual env vars can be used instead of (or to override) the config file:
      # - PRIMARY_CSMS_URL=wss://your-primary-csms.example.com/ocpp
      # - SECONDARY_CSMS_URLS=wss://secondary-a.example.com/ocpp,wss://secondary-b.example.com/ocpp
      # - LOG_LEVEL=info
    restart: unless-stopped

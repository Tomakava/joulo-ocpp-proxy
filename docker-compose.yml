services:
  ocpp-proxy:
    build: .
    user: node
    ports:
      - "9000:9000"
    volumes:
      # Mount a config file for structured configuration (recommended).
      # See config.example.json for all available options.
      - ./config.json:/data/config.json:ro
    environment:
      - PORT=9000
      - CONFIG_FILE=/data/config.json
      # Individual env vars can be used instead of (or to override) the config file:
      # - PRIMARY_CSMS_URL=wss://your-primary-csms.example.com/ocpp
      # - SECONDARY_CSMS_URLS=wss://secondary-a.example.com/ocpp,wss://secondary-b.example.com/ocpp
      # - LOG_LEVEL=info
    restart: unless-stopped
